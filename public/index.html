<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam Wishlist Tracker</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Steam Wishlist Tracker</h1>
    <div class="controls">
      <label>
        Sort
        <select id="sort-select">
          <option value="price" selected>Price (low to high)</option>
          <option value="discount">Discount % (high to low)</option>
          <option value="name">Name (A-Z)</option>
          <option value="dateAdded">Date added (newest)</option>
        </select>
      </label>
      <label>
        View
        <select id="view-select">
          <option value="cards" selected>Cards</option>
          <option value="list">List</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="filter-hide-unmatched" />
        Hide ITAD-unmatched
      </label>
      <label>
        <input type="checkbox" id="filter-potential-only" />
        Potential purchases only
      </label>
      <input type="search" id="filter-search" placeholder="Search by name..." />
      <span id="debug-controls" class="debug-controls hidden">
        <label>
          <input type="checkbox" id="debug-toggle" />
          Debug mode
        </label>
        <label>
          Game limit
          <input type="number" id="debug-limit-input" min="0" step="1" />
        </label>
        <label>
          History years (0=all time)
          <input type="number" id="debug-years-input" min="0" step="1" />
        </label>
      </span>
      <button id="refresh-btn">Refresh</button>
      <button id="force-refresh-btn" title="Bypass the 24h cache and re-fetch every game from Steam/ITAD">Force Refresh</button>
    </div>
  </header>

  <main id="content">
    <p id="status" class="status">Loading wishlist…</p>
    <div id="progress-bar" class="progress-bar hidden"><div id="progress-bar-fill" class="progress-bar-fill"></div></div>
    <div id="game-list" class="game-list"></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
