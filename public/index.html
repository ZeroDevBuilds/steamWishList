<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam Wishlist Tracker</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Steam Wishlist Tracker</h1>
    <div class="controls">
      <label>
        Sort
        <select id="sort-select">
          <option value="price" selected>Price (low to high)</option>
          <option value="discount">Discount % (high to low)</option>
          <option value="name">Name (A-Z)</option>
          <option value="dateAdded">Date added (newest)</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="filter-hide-unmatched" />
        Hide ITAD-unmatched
      </label>
      <label>
        <input type="checkbox" id="filter-potential-only" />
        Potential purchases only
      </label>
      <input type="search" id="filter-search" placeholder="Search by name..." />
      <span id="debug-controls" class="debug-controls hidden">
        <label>
          <input type="checkbox" id="debug-toggle" />
          Debug mode
        </label>
        <label>
          Game limit
          <input type="number" id="debug-limit-input" min="0" step="1" />
        </label>
        <label>
          History years (0=all time)
          <input type="number" id="debug-years-input" min="0" step="1" />
        </label>
      </span>
      <button id="refresh-btn">Refresh</button>
      <button id="force-refresh-btn" title="Bypass the 24h cache and re-fetch every game from Steam/ITAD">Force Refresh</button>
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" id="view-cards-btn" class="view-toggle-btn active" aria-pressed="true" title="Card view">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="7" x="3" y="3" rx="1.5" />
            <rect width="7" height="7" x="14" y="3" rx="1.5" />
            <rect width="7" height="7" x="14" y="14" rx="1.5" />
            <rect width="7" height="7" x="3" y="14" rx="1.5" />
          </svg>
        </button>
        <button type="button" id="view-list-btn" class="view-toggle-btn" aria-pressed="false" title="List view">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h.01" />
            <path d="M3 12h.01" />
            <path d="M3 18h.01" />
            <path d="M8 6h13" />
            <path d="M8 12h13" />
            <path d="M8 18h13" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="content">
    <p id="status" class="status">Loading wishlist…</p>
    <div id="progress-bar" class="progress-bar hidden"><div id="progress-bar-fill" class="progress-bar-fill"></div></div>
    <div id="game-list" class="game-list"></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
